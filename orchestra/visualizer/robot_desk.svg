<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#141a3a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".5"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="700" fill="url(#bg)"/>

  <!-- Boden -->
  <rect x="0" y="560" width="1000" height="140" fill="#0a0e1a"/>
  <line x1="0" y1="560" x2="1000" y2="560" stroke="#7c5cff" stroke-width="2" opacity=".4"/>

  <!-- HINTERGRUND: Skyline + Fenster -->
  <g opacity=".25">
    <rect x="50" y="180" width="90" height="380" fill="#0f1730"/>
    <rect x="170" y="240" width="70" height="320" fill="#0f1730"/>
    <rect x="270" y="150" width="100" height="410" fill="#0f1730"/>
    <rect x="400" y="220" width="80" height="340" fill="#0f1730"/>
    <rect x="510" y="170" width="90" height="390" fill="#0f1730"/>
    <rect x="630" y="250" width="70" height="310" fill="#0f1730"/>
    <rect x="730" y="160" width="100" height="400" fill="#0f1730"/>
    <rect x="860" y="230" width="80" height="330" fill="#0f1730"/>
    <!-- Fenster -->
    <g fill="#facc15" opacity=".4">
      <rect x="62" y="200" width="8" height="10"/><rect x="82" y="230" width="8" height="10"/>
      <rect x="285" y="180" width="8" height="10"/><rect x="310" y="210" width="8" height="10"/>
      <rect x="525" y="200" width="8" height="10"/><rect x="550" y="240" width="8" height="10"/>
      <rect x="745" y="190" width="8" height="10"/><rect x="780" y="230" width="8" height="10"/>
    </g>
  </g>

  <!-- SCHREIBTISCH (perspektivisch) -->
  <g>
    <!-- Tischplatte -->
    <path d="M 80 560 L 920 560 L 860 520 L 140 520 Z" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
    <path d="M 80 560 L 920 560 L 918 565 L 82 565 Z" fill="#1a202c"/>
    <!-- Tischbeine -->
    <rect x="130" y="565" width="18" height="80" fill="#1a202c"/>
    <rect x="852" y="565" width="18" height="80" fill="#1a202c"/>
  </g>

  <!-- MONITOR (auf Tisch) -->
  <g>
    <!-- Monitor-Rahmen -->
    <rect x="330" y="300" width="360" height="220" rx="10" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <!-- Bildschirm -->
    <rect x="342" y="312" width="336" height="196" rx="6" fill="url(#screen)"/>
    <!-- Bildschirm-Inhalt: Mini-Chart + Zahlen -->
    <!-- Grid -->
    <g stroke="#1e293b" stroke-width="1">
      <line x1="350" y1="360" x2="670" y2="360"/><line x1="350" y1="400" x2="670" y2="400"/>
      <line x1="350" y1="440" x2="670" y2="440"/><line x1="350" y1="480" x2="670" y2="480"/>
    </g>
    <!-- Chart-Linie (steigend) -->
    <polyline points="350,470 390,455 420,465 460,430 500,445 540,400 580,415 620,370 660,355" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <polyline points="350,470 390,455 420,465 460,430 500,445 540,400 580,415 620,370 660,355" fill="none" stroke="#22c55e" stroke-width="8" opacity=".15"/>
    <!-- Volumen-Balken -->
    <g fill="#38bdf8" opacity=".5">
      <rect x="355" y="490" width="10" height="14"/><rect x="375" y="485" width="10" height="19"/>
      <rect x="395" y="492" width="10" height="12"/><rect x="415" y="480" width="10" height="24"/>
      <rect x="435" y="488" width="10" height="16"/><rect x="455" y="475" width="10" height="29"/>
    </g>
    <!-- Signal-Badge -->
    <rect x="560" y="322" width="100" height="28" rx="6" fill="#22c55e" opacity=".9"/>
    <text x="610" y="341" text-anchor="middle" fill="#052e16" font-size="15" font-weight="bold">BUY ▲</text>
    <!-- Titel -->
    <text x="352" y="336" fill="#94a3b8" font-size="12">AAPL · 1D · SR FLIP BREAKOUT</text>
    <!-- Monitor-Ständer -->
    <rect x="490" y="520" width="40" height="6" fill="#334155"/>
    <rect x="480" y="526" width="60" height="8" fill="#1a202c"/>
  </g>

  <!-- TASTATUR + MAUS -->
  <g>
    <rect x="380" y="540" width="180" height="16" rx="4" fill="#1e293b" stroke="#334155"/>
    <g fill="#334155">
      <rect x="388" y="543" width="8" height="4" rx="1"/><rect x="400" y="543" width="8" height="4" rx="1"/>
      <rect x="412" y="543" width="8" height="4" rx="1"/><rect x="424" y="543" width="8" height="4" rx="1"/>
      <rect x="436" y="543" width="8" height="4" rx="1"/><rect x="448" y="543" width="8" height="4" rx="1"/>
      <rect x="460" y="543" width="8" height="4" rx="1"/><rect x="472" y="543" width="8" height="4" rx="1"/>
      <rect x="484" y="543" width="8" height="4" rx="1"/><rect x="496" y="543" width="8" height="4" rx="1"/>
      <rect x="508" y="543" width="8" height="4" rx="1"/><rect x="520" y="543" width="8" height="4" rx="1"/>
      <rect x="532" y="543" width="8" height="4" rx="1"/><rect x="544" y="543" width="8" height="4" rx="1"/>
    </g>
    <rect x="590" y="542" width="30" height="18" rx="9" fill="#1e293b" stroke="#334155"/>
  </g>

  <!-- KAFFEE-TASSE -->
  <g>
    <rect x="700" y="530" width="28" height="30" rx="4" fill="#78350f"/>
    <rect x="698" y="528" width="32" height="6" rx="3" fill="#78350f"/>
    <ellipse cx="714" cy="534" rx="12" ry="4" fill="#451a03"/>
    <path d="M 728 536 q 10 4 0 14" fill="none" stroke="#78350f" stroke-width="3"/>
    <!-- Dampf -->
    <path d="M 708 522 q 3 -6 0 -12 M 718 522 q -3 -6 0 -12" fill="none" stroke="#94a3b8" stroke-width="2" opacity=".5"/>
  </g>

  <!-- PFLANZE -->
  <g>
    <rect x="180" y="530" width="26" height="30" rx="3" fill="#4a5568"/>
    <path d="M 193 530 q -12 -30 0 -50 q 14 20 0 50" fill="#22c55e"/>
    <path d="M 193 530 q 12 -25 2 -45 q -14 18 -2 45" fill="#16a34a"/>
    <path d="M 193 530 q 0 -35 0 -55" fill="none" stroke="#15803d" stroke-width="3"/>
  </g>

  <!-- ====== ROBOTER (am Schreibtisch, von hinten/rechts sitzend) ====== -->
  <g>
    <!-- Stuhl -->
    <rect x="60" y="440" width="180" height="120" rx="20" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <rect x="50" y="430" width="200" height="16" rx="8" fill="#2d3748"/>
    <!-- Roboter-Körper -->
    <rect x="95" y="380" width="110" height="130" rx="40" fill="url(#metal)" stroke="#64748b" stroke-width="3"/>
    <!-- Roboter-Kopf -->
    <circle cx="150" cy="320" r="62" fill="#f1f5f9" stroke="#94a3b8" stroke-width="4"/>
    <!-- Antenne -->
    <line x1="150" y1="258" x2="150" y2="228" stroke="#7c5cff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="150" cy="222" r="9" fill="#38bdf8" filter="url(#glow)"/>
    <!-- Visier (von hinten sichtbar — Roboter schaut auf Monitor) -->
    <path d="M 100 300 Q 150 340 200 300 L 200 260 Q 150 300 100 260 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Augen im Visier (leuchten, schauen auf Monitor) -->
    <circle cx="132" cy="305" r="7" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="168" cy="305" r="7" fill="#38bdf8" filter="url(#glow)"/>
    <!-- Ohren/Kopfhörer -->
    <rect x="80" y="300" width="14" height="40" rx="7" fill="#7c5cff"/>
    <rect x="206" y="300" width="14" height="40" rx="7" fill="#7c5cff"/>
    <!-- Körper-Details: Statusleuchten -->
    <circle cx="125" cy="420" r="8" fill="#22c55e" filter="url(#glow)"/>
    <circle cx="150" cy="420" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="175" cy="420" r="8" fill="#facc15" filter="url(#glow)"/>
    <!-- Arme (zum Monitor gestreckt) -->
    <path d="M 200 410 Q 260 380 300 400" fill="none" stroke="#94a3b8" stroke-width="14" stroke-linecap="round"/>
    <path d="M 100 410 Q 60 450 60 500" fill="none" stroke="#94a3b8" stroke-width="14" stroke-linecap="round"/>
    <!-- Hand (auf Tastatur) -->
    <circle cx="300" cy="400" r="12" fill="#cbd5e1" stroke="#64748b"/>
  </g>

  <!-- LICHT (Spot von oben) -->
  <ellipse cx="510" cy="300" rx="200" ry="120" fill="url(#glowBlue)" opacity=".2"/>

  <!-- Status-Banner oben -->
  <g>
    <rect x="250" y="40" width="500" height="60" rx="14" fill="#0f172a" stroke="#7c5cff" stroke-width="2" filter="url(#soft)"/>
    <rect x="258" y="48" width="484" height="44" rx="10" fill="#1e293b"/>
    <text x="500" y="70" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">🤖 ROBOTER @ WORK</text>
    <text x="500" y="88" text-anchor="middle" fill="#94a3b8" font-size="12">Floor 01 · Scanner · 14 Symbole scannen · Vol &gt; 1.25x Gate</text>
    <circle cx="270" cy="58" r="6" fill="#22c55e"><animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>

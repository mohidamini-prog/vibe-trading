    <rect x="230" y="65" width="190" height="80" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="325" y="90" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="bold">EXIT</text>
    <text x="325" y="115" text-anchor="middle" fill="#e2e8f0" font-size="11">SL / TP1 / TP2</text>
    <text x="325" y="133" text-anchor="middle" fill="#64748b" font-size="10">S/R + Fib levels</text>
    <rect x="440" y="65" width="190" height="80" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="535" y="90" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="bold">INVALIDATION</text>
    <text x="535" y="115" text-anchor="middle" fill="#e2e8f0" font-size="11">below support</text>
    <text x="535" y="133" text-anchor="middle" fill="#64748b" font-size="10">setup broken</text>
    <!-- Robot (Strategy) -->
    <g transform="translate(700,95)">
      <path d="M -14 0 A 14 14 0 0 1 14 0" fill="none" stroke="#a78bfa" stroke-width="4"/>
      <rect x="-17" y="-2" width="6" height="12" rx="2" fill="#a78bfa"/>
      <rect x="11" y="-2" width="6" height="12" rx="2" fill="#a78bfa"/>
      <rect x="-16" y="4" width="32" height="32" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <circle cx="0" cy="12" r="12" fill="#fff" stroke="#cbd5e1"/>
      <rect x="-9" y="6" width="18" height="9" rx="4" fill="#0f172a"/>
      <circle cx="-3.5" cy="10.5" r="2" fill="#a78bfa"/>
      <circle cx="3.5" cy="10.5" r="2" fill="#a78bfa"/>

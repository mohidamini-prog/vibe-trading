<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#141a3a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#bg13)"/>

  <!-- FLOOR 01: SCANNER -->
  <g transform="translate(20,15)">
    <rect width="860" height="165" rx="10" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
    <text x="20" y="30" fill="#facc15" font-size="18" font-weight="bold">FLOOR 01 — SCANNER</text>
    <text x="20" y="50" fill="#94a3b8" font-size="11">FIRST, FIND A MOVE WORTH INVESTIGATING · 14 symbols · 2 timeframes</text>

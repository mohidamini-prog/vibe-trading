<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg46" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#141a3a"/>
    </linearGradient>
    <radialGradient id="glow46" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".2"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="560" fill="url(#bg46)"/>

  <!-- FLOOR 04: TESTING -->
  <g transform="translate(20,15)">
    <rect width="860" height="165" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="30" fill="#38bdf8" font-size="18" font-weight="bold">FLOOR 04 — TESTING</text>
    <text x="20" y="50" fill="#94a3b8" font-size="11">TEST THE RULES BEFORE TRUSTING THEM · Fees · Slippage · Unseen data</text>
    <!-- Screen: FEES -->
    <rect x="20" y="65" width="190" height="80" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="115" y="90" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">FEES</text>
    <text x="115" y="115" text-anchor="middle" fill="#e2e8f0" font-size="11">0.25% per trade</text>
    <text x="115" y="133" text-anchor="middle" fill="#64748b" font-size="10">modeled in sim</text>
    <!-- Screen: SLIPPAGE -->
    <rect x="230" y="65" width="190" height="80" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="325" y="90" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">SLIPPAGE</text>
    <text x="325" y="115" text-anchor="middle" fill="#e2e8f0" font-size="11">cap 2.0%</text>
    <text x="325" y="133" text-anchor="middle" fill="#64748b" font-size="10">worst-case fill</text>
    <!-- Screen: UNSEEN DATA -->
    <rect x="440" y="65" width="190" height="80" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="535" y="90" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">UNSEEN DATA</text>
    <text x="535" y="115" text-anchor="middle" fill="#e2e8f0" font-size="11">rug / honeypot</text>
    <text x="535" y="133" text-anchor="middle" fill="#64748b" font-size="10">flagged &amp; killed</text>
    <!-- Robot (Testing) -->
    <g transform="translate(700,95)">
      <path d="M -14 0 A 14 14 0 0 1 14 0" fill="none" stroke="#38bdf8" stroke-width="4"/>
      <rect x="-17" y="-2" width="6" height="12" rx="2" fill="#38bdf8"/>
      <rect x="11" y="-2" width="6" height="12" rx="2" fill="#38bdf8"/>
      <rect x="-16" y="4" width="32" height="32" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <circle cx="0" cy="12" r="12" fill="#fff" stroke="#cbd5e1"/>
      <rect x="-9" y="6" width="18" height="9" rx="4" fill="#0f172a"/>
      <circle cx="-3.5" cy="10.5" r="2" fill="#38bdf8"/>
      <circle cx="3.5" cy="10.5" r="2" fill="#38bdf8"/>
    </g>
  </g>

  <!-- FLOOR 05: RISK -->
  <g transform="translate(20,190)">
    <rect width="860" height="165" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="20" y="30" fill="#a78bfa" font-size="18" font-weight="bold">FLOOR 05 — RISK</text>
    <text x="20" y="50" fill="#94a3b8" font-size="11">A GOOD STORY STILL NEEDS LIMITS · Position size · Exposure · Loss limits</text>
    <rect x="20" y="65" width="190" height="80" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="115" y="90" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="bold">POSITION SIZE</text>
    <text x="115" y="115" text-anchor="middle" fill="#e2e8f0" font-size="11">max 7% per trade</text>
    <text x="115" y="133" text-anchor="middle" fill="#64748b" font-size="10">fixed fraction</text>
    <rect x="230" y="65" width="190" height="80" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="325" y="90" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="bold">EXPOSURE</text>
    <text x="325" y="115" text-anchor="middle" fill="#e2e8f0" font-size="11">max 5 positions</text>
    <text x="325" y="133" text-anchor="middle" fill="#64748b" font-size="10">never full book</text>
    <rect x="440" y="65" width="190" height="80" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="535" y="90" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="bold">LOSS LIMITS</text>
    <text x="535" y="115" text-anchor="middle" fill="#e2e8f0" font-size="11">SL from S/R + Fib</text>
    <text x="535" y="133" text-anchor="middle" fill="#64748b" font-size="10">circuit breaker</text>
    <!-- Robot (Risk) -->
    <g transform="translate(700,95)">
      <path d="M -14 0 A 14 14 0 0 1 14 0" fill="none" stroke="#a78bfa" stroke-width="4"/>
      <rect x="-17" y="-2" width="6" height="12" rx="2" fill="#a78bfa"/>
      <rect x="11" y="-2" width="6" height="12" rx="2" fill="#a78bfa"/>
      <rect x="-16" y="4" width="32" height="32" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <circle cx="0" cy="12" r="12" fill="#fff" stroke="#cbd5e1"/>
      <rect x="-9" y="6" width="18" height="9" rx="4" fill="#0f172a"/>
      <circle cx="-3.5" cy="10.5" r="2" fill="#a78bfa"/>
      <circle cx="3.5" cy="10.5" r="2" fill="#a78bfa"/>
    </g>
  </g>

  <!-- FLOOR 06: CONTROL -->
  <g transform="translate(20,365)">
    <rect width="860" height="165" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="20" y="30" fill="#22c55e" font-size="18" font-weight="bold">FLOOR 06 — CONTROL</text>
    <text x="20" y="50" fill="#94a3b8" font-size="11">THE FINAL DECISION CAN BE: WAIT · Test · Wait · Reject</text>
    <rect x="20" y="65" width="190" height="80" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <text x="115" y="90" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">TEST</text>
    <text x="115" y="115" text-anchor="middle" fill="#e2e8f0" font-size="11">conductor vote</text>
    <text x="115" y="133" text-anchor="middle" fill="#64748b" font-size="10">S &gt; 0.5 = BUY</text>
    <rect x="230" y="65" width="190" height="80" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <text x="325" y="90" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">WAIT</text>
    <text x="325" y="115" text-anchor="middle" fill="#e2e8f0" font-size="11">all filters pass?</text>
    <text x="325" y="133" text-anchor="middle" fill="#64748b" font-size="10">S &lt; 0.5 = HOLD</text>
    <rect x="440" y="65" width="190" height="80" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <text x="535" y="90" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">REJECT</text>
    <text x="535" y="115" text-anchor="middle" fill="#e2e8f0" font-size="11">risk veto / gate</text>
    <text x="535" y="133" text-anchor="middle" fill="#64748b" font-size="10">earnings / insider</text>
    <!-- Robot (Control) -->
    <g transform="translate(700,95)">
      <path d="M -14 0 A 14 14 0 0 1 14 0" fill="none" stroke="#22c55e" stroke-width="4"/>
      <rect x="-17" y="-2" width="6" height="12" rx="2" fill="#22c55e"/>
      <rect x="11" y="-2" width="6" height="12" rx="2" fill="#22c55e"/>
      <rect x="-16" y="4" width="32" height="32" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <circle cx="0" cy="12" r="12" fill="#fff" stroke="#cbd5e1"/>
      <rect x="-9" y="6" width="18" height="9" rx="4" fill="#0f172a"/>
      <circle cx="-3.5" cy="10.5" r="2" fill="#22c55e"/>
      <circle cx="3.5" cy="10.5" r="2" fill="#22c55e"/>
    </g>
  </g>
</svg>
